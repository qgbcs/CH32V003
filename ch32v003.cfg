# ============================================================================
# CH32V003 + WCH-LinkE  OpenOCD 调试/烧录通用配置 (RISC-V RV32EC, SDI 单线调试)
#
# 适用: WCH 定制版 OpenOCD (内置 wlinke / sdi / wch_riscv 驱动)
#   例如 openocd-wch-ch32v003-bootfix (0.11.0+dev)
#
# 前提:
#   1. WCH-LinkE 已切换到 RV 模式 (WCH-LinkUtility: Active WCH-Link Mode =
#      WCH-LinkRV；空闲时 LinkE 蓝灯常灭)
#   2. 接线: SWDIO<->PD1, SWCLK<->PD2(可不接), GND, 3V3->VDD
#
# 用法:
#   启动 GDB Server (监听 3333):
#     openocd -f ch32v003.cfg
#   烧录:
#     openocd -f ch32v003.cfg -f flash_wch.tcl
# ============================================================================

# WCH-LinkE 适配器 + WCH 私有 SDI 传输
adapter driver wlinke
adapter speed 6000
transport select sdi

# 指定目标芯片型号 (影响 flash 算法)
chip_id CH32V003

set _CHIPNAME   wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME

# SRAM 工作区 (与 WCH 官方 ch32v003 cfg 一致)
$_TARGETNAME.0 configure -work-area-phys 0x20000000 -work-area-size 10000 -work-area-backup 1

# 用户代码 Flash 16KB, 调试口地址 0x08000000 (CPU 视角从 0x00000000 执行)
set _USER_FLASHNAME $_CHIPNAME.user
flash bank $_USER_FLASHNAME wch_riscv 0x08000000 0x00004000 0 0 $_TARGETNAME.0

# 系统 Boot Flash 4KB
set _BOOT_FLASHNAME $_CHIPNAME.boot
flash bank $_BOOT_FLASHNAME wch_riscv 0x1ffff000 0x00001000 0 0 $_TARGETNAME.0

# GDB 一连上就 halt, 方便直接单步
$_TARGETNAME.0 configure -event gdb-attach {
    echo "GDB attached - halting CH32V003"
    halt
}
